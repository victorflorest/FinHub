{% extends 'base.html' %}

{% block title %}{{ t.add_transaction }}{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h2 class="mb-4">{{ t.add_transaction }}</h2>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary">
                        {{ t.save_transaction }}
                    </button>
                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
